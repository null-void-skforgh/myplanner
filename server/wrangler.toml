# マイプランナー サーバー（Cloudflare Workers）
# 秘密の値は `npx wrangler secret put PAIR_CODE` などで登録する（このファイルには書かない）
name = "myplanner-server"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://null-void-skforgh.github.io,http://127.0.0.1:8765"
VAPID_SUBJECT = "https://null-void-skforgh.github.io/myplanner/"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "myplanner"
database_id = "__D1_DATABASE_ID__"
