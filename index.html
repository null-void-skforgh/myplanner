<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マイプランナー">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>マイプランナー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/month.css">
<link rel="stylesheet" href="css/timegrid.css">
<link rel="stylesheet" href="css/agenda.css">
<link rel="stylesheet" href="css/pages.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <main class="pages">
    <div class="page" id="page-cal"></div>
    <div class="page" id="page-todo"></div>
    <div class="page" id="page-memo"></div>
    <div class="page" id="page-settings"></div>
  </main>

  <nav class="tab-bar" role="tablist">
    <button class="tab" data-page="cal" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      カレンダー
    </button>
    <button class="tab" data-page="todo" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Todo
    </button>
    <button class="tab" data-page="memo" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      メモ
    </button>
    <button class="tab" data-page="settings" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      設定
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<div id="fatal" class="fatal" hidden>
  <h2>読み込みに失敗しました</h2>
  <p>データは消えていません。アプリを閉じて開き直してください。直らない場合は下の内容を開発者に送ってください。</p>
  <pre></pre>
</div>
<noscript><p style="padding:24px">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
